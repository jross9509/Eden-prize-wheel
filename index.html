<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prize Wheel">
<meta name="theme-color" content="#c58a32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Prize Wheel</title>
<style>
:root{--gold:#c58a32;--cream:#f7efe3;--ink:#292522}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fbf8f3;color:var(--ink)}
body{display:flex;justify-content:center}
.app{width:min(100%,1100px);padding:18px 18px 30px}
header{text-align:center;margin-bottom:8px}
h1{margin:4px 0;font-size:28px}.sub{color:#766758;font-size:14px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center}
.stage{position:relative;width:min(100%,650px);margin:auto;aspect-ratio:1}
.wheel{position:absolute;inset:4%;border-radius:50%;overflow:hidden;border:13px solid #c68b38;box-shadow:inset 0 0 0 3px #f4d49b,0 8px 20px #0002;transition:transform 4.8s cubic-bezier(.12,.75,.15,1)}
.wheel svg{width:100%;height:100%;display:block}
.pointer{position:absolute;z-index:5;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:34px solid transparent;border-right:34px solid transparent;border-top:64px solid #c88d3c;filter:drop-shadow(0 3px 2px #0004)}
.pointer:after{content:"";position:absolute;left:-27px;top:-59px;border-left:27px solid transparent;border-right:27px solid transparent;border-top:50px solid #f0c77e}
.center{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:50%;border:5px solid #b97d2b;background:radial-gradient(circle at 35% 30%,#ffe7af,#d89c46 72%,#b97624);box-shadow:0 4px 9px #0003;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:18px;line-height:1.12;color:#292522;cursor:pointer}
.center:active{transform:translate(-50%,-50%) scale(.97)}
.panel{background:var(--cream);border:1px solid #dbc6a9;border-radius:18px;padding:18px}
label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
textarea{width:100%;min-height:190px;resize:vertical;border:1px solid #d1bda2;border-radius:12px;background:#fffaf4;padding:11px;font:inherit;font-size:16px;line-height:1.5;outline:none}
button{width:100%;min-height:48px;border:0;border-radius:12px;background:#b87925;color:#fff;font-weight:850;font-size:15px;cursor:pointer;margin-top:10px;touch-action:manipulation}
button.secondary{background:#eadcc8;color:#4b3927}
.result{margin-top:13px;padding:13px;border-radius:12px;background:#fff;border:1px solid #e1ceb5;text-align:center}
.result small{display:block;color:#776858;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}
.result strong{display:block;margin-top:4px;font-size:19px}
.hint{font-size:12px;color:#766758;line-height:1.4;margin:10px 0 0}
@media(max-width:800px){.main{grid-template-columns:1fr}.stage{max-width:620px}.panel{max-width:620px;margin:auto}}
@media(prefers-reduced-motion:reduce){.wheel{transition:none}}
</style>
</head>
<body>
<div class="app">
<header><h1>Prize Wheel</h1><div class="sub">Tap the wheel or “Spin Now” to choose a prize.</div></header>
<div class="main">
<div class="stage">
<div class="pointer" aria-hidden="true"></div>
<div id="wheel" class="wheel"><svg id="svg" viewBox="0 0 500 500" role="img" aria-label="Prize wheel"></svg></div>
<button id="spin" class="center" aria-label="Spin the prize wheel">GIRE<br>A ROLETA!</button>
</div>
<div class="panel">
<label for="prizes">Prizes — one per line</label>
<textarea id="prizes">RED BULL
BARRA DE PROTEÍNA
BARRA DE CEREAL
PRO FORCE SHAKE
MASSAGEM 5 MIN
AJUSTE QUIRO
NÃO FOI DESSA VEZ!</textarea>
<button id="update">Update Wheel</button>
<button id="spin2" class="secondary">Spin Now</button>
<div class="result" aria-live="polite"><small>Result</small><strong id="result">Ready to spin</strong></div>
<p class="hint">This app works offline once installed/hosted. Edit the prize list anytime.</p>
</div>
</div>
</div>
<script>
(()=> {
const svg=document.querySelector('#svg'),wheel=document.querySelector('#wheel'),input=document.querySelector('#prizes'),result=document.querySelector('#result');
const NS='http://www.w3.org/2000/svg'; let prizes=[],rotation=0,spinning=false;
const colors=['#d9dcc5','#f7eee4','#ead0ae','#f5eadb','#d9dcc5','#f0ddc4','#f7eee4','#e7c79d'];
function type(n){n=n.toLowerCase();if(n.includes('red bull'))return'battery';if(n.includes('proteína'))return'protein';if(n.includes('cereal'))return'cereal';if(n.includes('shake'))return'shaker';if(n.includes('massagem'))return'massage';if(n.includes('quiro'))return'spine';if(n.includes('não')||n.includes('nao'))return'x';return'star'}
function icon(t,x,y,rot){
const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${x} ${y}) rotate(${rot})`);g.setAttribute('fill','none');g.setAttribute('stroke','#292522');g.setAttribute('stroke-width','3');g.setAttribute('stroke-linecap','round');g.setAttribute('stroke-linejoin','round');
if(t==='battery')g.innerHTML='<rect x="-13" y="-23" width="26" height="43" rx="6" fill="#eee8d7"/><path d="M-5 -28h10"/><path d="M2 -13l-9 15h7l-3 13L9 -3H2z" fill="#292522" stroke="none"/><path d="M-10 13h20"/>';
else if(t==='protein'||t==='cereal')g.innerHTML='<path d="M-25 -12 Q0 -23 25 -12 L21 14 Q0 23 -21 14Z" fill="#ead5b7"/><path d="M-20 -8 Q0 -17 20 -8"/><path d="M-20 9 Q0 17 20 9"/>'+(t==='cereal'?'<path d="M-4 5q4-10 9-1q-5 8-9 1z"/>':'');
else if(t==='shaker')g.innerHTML='<path d="M-14 -20h28l-3 7h-22z" fill="#e7dfcf"/><path d="M-18 -13h36v9h-36z" fill="#d3c9b8"/><path d="M-14 -4h28l-4 31h-20z" fill="#e7dfcf"/><path d="M-8 2h16M-9 10h18"/>';
else if(t==='massage')g.innerHTML='<path d="M-34 -5h55q9 0 12 7H-34z" fill="#292522"/><path d="M-25 2v19M20 2v19M-25 21l-13 8M20 21l12 8"/><circle cx="-7" cy="-13" r="6" fill="#292522"/>';
else if(t==='spine')g.innerHTML='<path d="M-3 -27q12 6 0 13t0 13t0 13"/><ellipse cx="-3" cy="-22" rx="7" ry="4" fill="#292522"/><ellipse cx="1" cy="-9" rx="7" ry="4" fill="#292522"/><ellipse cx="-2" cy="4" rx="7" ry="4" fill="#292522"/><ellipse cx="2" cy="17" rx="7" ry="4" fill="#292522"/>';
else if(t==='x'){g.setAttribute('stroke-width','9');g.innerHTML='<path d="M-22 -22L22 22M22 -22L-22 22"/>'}
else g.innerHTML='<circle cx="0" cy="0" r="19" fill="#ead5a9"/><path d="M0 -14L4 -4L15 -4L6 3L9 14L0 8L-9 14L-6 3L-15 -4L-4 -4z" fill="#292522" stroke="none"/>';
return g}
function render(){
prizes=input.value.split(/\n/).map(s=>s.trim()).filter(Boolean).slice(0,24);if(prizes.length<2)prizes=['PRÊMIO 1','PRÊMIO 2'];
svg.innerHTML='';const cx=250,cy=250,r=247,n=prizes.length,g=document.createElementNS(NS,'g');
for(let i=0;i<n;i++){const a0=i/n*Math.PI*2-Math.PI/2,a1=(i+1)/n*Math.PI*2-Math.PI/2,x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
const p=document.createElementNS(NS,'path');p.setAttribute('d',`M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 0 1 ${x1} ${y1} Z`);p.setAttribute('fill',colors[i%colors.length]);p.setAttribute('stroke','#d2c1aa');p.setAttribute('stroke-width','2');g.appendChild(p);
const mid=(a0+a1)/2,ir=n>9?r*.56:r*.55,ix=cx+ir*Math.cos(mid),iy=cy+ir*Math.sin(mid),deg=mid*180/Math.PI+90;g.appendChild(icon(type(prizes[i]),ix,iy,deg));
const tx=cx+r*.70*Math.cos(mid),ty=cy+r*.70*Math.sin(mid),text=document.createElementNS(NS,'text');text.setAttribute('x',tx);text.setAttribute('y',ty);text.setAttribute('transform',`rotate(${deg} ${tx} ${ty})`);text.setAttribute('text-anchor','middle');text.setAttribute('dominant-baseline','middle');text.setAttribute('font-size',n>10?'9':'12');text.setAttribute('font-weight','900');
let lines=[''];prizes[i].toUpperCase().split(/\s+/).forEach(w=>{let z=lines[lines.length-1];if((z+' '+w).trim().length>13&&z)lines.push(w);else lines[lines.length-1]=(z+' '+w).trim()});lines.slice(0,3).forEach((line,j)=>{let t=document.createElementNS(NS,'tspan');t.setAttribute('x',tx);t.setAttribute('dy',j===0?`${-(lines.length-1)*.55}em`:'1.05em');t.textContent=line;text.appendChild(t)});g.appendChild(text)}
svg.appendChild(g)}
function spin(){if(spinning)return;spinning=true;result.textContent='Spinning…';const n=prizes.length,w=Math.floor(Math.random()*n),seg=360/n,target=360-(w*seg+seg/2);rotation+=1440+target-((rotation%360)+360)%360;wheel.style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{result.textContent=prizes[w];spinning=false},4900)}
document.querySelector('#update').onclick=()=>{if(!spinning){render();result.textContent='Ready to spin'}};document.querySelector('#spin').onclick=spin;document.querySelector('#spin2').onclick=spin;render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
